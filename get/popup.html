<!DOCTYPE html>
<html>

<head>
    <title>Popup</title>
    <style>
        .body {
            width: 400px;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* =========================
       Common UL/LI styling
       ========================= */
        ul {
            padding: 0;
            list-style: none;
            margin: 0;
        }

        /* =========================
       Domain Accordion Container
       ========================= */
        .domain-accordion {
            border: 1px solid #ddd;
            margin-bottom: 16px;
            border-radius: 4px;
            background-color: #fafafa;
        }

        /* =========================
       Domain Header (e.g. "www.youtube.com")
       ========================= */
        .domain-accordion>h3 {
            margin: 0;
            padding: 8px 12px;
            font-size: 16px;
            background-color: #f7f7f7;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            user-select: none;
        }

        .domain-accordion>h3:hover {
            background-color: #f0f0f0;
        }

        /* =========================
       Category List inside Domain Accordion
       ========================= */
        .domain-accordion ul {
            margin: 0;
            padding: 0;
        }

        /* =========================
       Category Item (e.g. "雑談系 (2)")
       ========================= */
        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            background-color: #fff;
        }

        .category-item:hover {
            background-color: #f9f9f9;
        }

        /* Category title: clickable area that opens URLs */
        .category-title {
            flex-grow: 1;
            margin-right: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        /* Trash Button for Category */
        .trash {
            font-size: 24px;
            position: relative;
            width: 0.9em;
            height: 1.2em;
            border-left: 0.1em solid #39a9d6;
            border-right: 0.1em solid #39a9d6;
            border-bottom: 0.1em solid #39a9d6;
            border-radius: 0 0 0.1em 0.1em;
            background:
                linear-gradient(to bottom, #39a9d6 0%, #39a9d6 100%) 0.2em 0.2em,
                linear-gradient(to bottom, #39a9d6 0%, #39a9d6 100%) 0.4em 0.2em,
                linear-gradient(to bottom, #39a9d6 0%, #39a9d6 100%) 0.6em 0.2em;
            background-size: 0.1em 0.8em;
            background-repeat: no-repeat;
        }

        /* 蓋 */
        .trash::before {
            content: "";
            position: absolute;
            top: -0.1em;
            left: -0.2em;
            width: 1.3em;
            height: 0.1em;
            background-color: #39a9d6;
        }

        /* 取っ手 */
        .trash::after {
            content: "";
            position: absolute;
            top: -0.3em;
            left: 0.1em;
            width: 0.5em;
            height: 0.2em;
            border-top: 0.1em solid #39a9d6;
            border-left: 0.1em solid #39a9d6;
            border-right: 0.1em solid #39a9d6;
            border-radius: 0.1em 0.1em 0 0;
        }

        /* =========================
       If you still want the old .url-item style, keep it here
       (For non-accordion items, if needed)
       ========================= */
        .url-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            font-size: 24px;
        }

        .url-item:hover {
            background-color: #f0f0f0;
        }

        /* We also keep .url-content, .url-count from before if needed */
        .url-content {
            flex-grow: 1;
            padding-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url-count {
            color: #007bff;
            font-weight: bold;
        }

        /* No-item message (e.g., "アイテムはありません") */
        .no-item {
            text-align: center;
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="body">
        <div id="accordion-container"></div>
        <ul id="url-list"></ul>
    </div>
    <script type="module" src="dist/popup.js"></script>
</body>

</html>
